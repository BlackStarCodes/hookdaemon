[project]
name = "hookdaemon"
version = "0.1.0"
description = "Reliable webhook delivery infrastructure"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "BlackStarCodes", email = "301748195+BlackStarCodes@users.noreply.github.com" }]
keywords = ["webhooks", "fastapi", "postgresql", "redis", "backend", "distributed-systems"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=26.1.0",
    "sqlalchemy[asyncio]>=2.0.53",
    "asyncpg>=0.31.0",
    "alembic>=1.20.0",
    "prometheus-client>=0.26.0",
]

[project.urls]
Homepage = "https://github.com/BlackStarCodes/hookdaemon"
Repository = "https://github.com/BlackStarCodes/hookdaemon"
Issues = "https://github.com/BlackStarCodes/hookdaemon/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=4.6.2",
    "detect-secrets>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
show_error_codes = true
warn_unreachable = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]

[tool.uv]
required-version = ">=0.12.5"
